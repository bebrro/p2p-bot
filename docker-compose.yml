version: "3.9"

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://p2pbot:${POSTGRES_PASSWORD:-changeme}@postgres:5432/p2pbot
    ports:
      - "${WEBAPP_PORT:-8765}:${WEBAPP_PORT:-8765}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${WEBAPP_PORT:-8765}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       p2pbot
      POSTGRES_USER:     p2pbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2pbot -d p2pbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
