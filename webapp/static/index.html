<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P2P Анализатор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Reset ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

/* ── Theme variables (Telegram injects --tg-theme-* at runtime) ── */
:root {
  --bg:   var(--tg-theme-bg-color,           #17212b);
  --bg2:  var(--tg-theme-secondary-bg-color, #232e3c);
  --text: var(--tg-theme-text-color,         #f5f5f5);
  --hint: var(--tg-theme-hint-color,         #708499);
  --link: var(--tg-theme-link-color,         #2ca5e0);
  --btn:  var(--tg-theme-button-color,       #2ca5e0);
  --btnt: var(--tg-theme-button-text-color,  #fff);
  --green:  #43b581;
  --red:    #f04747;
  --yellow: #faa61a;
  --r: 10px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────── */
.header {
  background: var(--bg2);
  padding: 10px 12px 8px;
  flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.header-title {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pill-row { display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.pill-row::-webkit-scrollbar { display: none; }

.pill {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
  color: var(--hint);
  cursor: pointer;
  font-size: 11px;
  white-space: nowrap;
  transition: all .15s;
  flex-shrink: 0;
}
.pill.active {
  background: var(--btn);
  color: var(--btnt);
  border-color: var(--btn);
  font-weight: 600;
}

/* ── Spread bar ──────────────────────────────────────── */
.spread-bar {
  background: var(--bg2);
  padding: 7px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  flex-shrink: 0;
  min-height: 40px;
}
.price-big { font-size: 14px; font-weight: 700; }
.price-big.green { color: var(--green); }
.price-big.red   { color: var(--red);   }
.spread-chip {
  background: rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}
.spread-chip.good { background: rgba(67,181,129,.2); color: var(--green); }
.spread-chip.mid  { background: rgba(250,166,26,.2);  color: var(--yellow);}

/* ── Scrollable content ──────────────────────────────── */
.tab-panel {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 8px 8px 4px;
}
.tab-panel.hidden { display: none; }

/* ── Refresh timestamp ───────────────────────────────── */
.refresh-ts {
  font-size: 10px;
  color: var(--hint);
  text-align: right;
  margin-bottom: 5px;
  height: 14px;
}

/* ── Orderbook grid ──────────────────────────────────── */
.book-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.col-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-bottom: 5px;
}
.buy-col  .col-title { color: var(--green); }
.sell-col .col-title { color: var(--red);   }

/* ── Ad card ─────────────────────────────────────────── */
.ad-card {
  background: var(--bg2);
  border-radius: 8px;
  padding: 7px 8px;
  margin-bottom: 5px;
  border-left: 2px solid transparent;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
.buy-col  .ad-card { border-left-color: var(--green); }
.sell-col .ad-card { border-left-color: var(--red);   }

.ad-price {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 2px;
}
.buy-col  .ad-price { color: var(--green); }
.sell-col .ad-price { color: var(--red);   }

.ad-nick {
  font-size: 11px;
  color: var(--text);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
  margin-bottom: 2px;
}
.ad-meta {
  font-size: 10px;
  color: var(--hint);
  line-height: 1.45;
}
.pay-pill {
  display: inline-block;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  padding: 0 3px;
  margin: 1px 1px 0 0;
}
.risk { font-size: 10px; }

/* ── Chart tab ───────────────────────────────────────── */
.chart-card {
  background: var(--bg2);
  border-radius: var(--r);
  padding: 10px 10px 8px;
  margin-bottom: 8px;
}
.chart-box { position: relative; height: 200px; }
.chart-empty {
  font-size: 13px;
  color: var(--hint);
  text-align: center;
  padding: 60px 20px;
  line-height: 1.6;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.stat-card {
  background: var(--bg2);
  border-radius: var(--r);
  padding: 10px 12px;
}
.stat-lbl { font-size: 10px; color: var(--hint); margin-bottom: 3px; }
.stat-val { font-size: 18px; font-weight: 700; }
.stat-sub { font-size: 10px; color: var(--hint); margin-top: 1px; }

/* ── AI Chat tab ─────────────────────────────────────── */
#tab-ai {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 10px 10px 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-msg {
  max-width: 84%;
  padding: 9px 12px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
  word-break: break-word;
  white-space: pre-wrap;
  animation: fadeIn .2s ease;
}
.chat-msg.user {
  align-self: flex-end;
  background: var(--btn);
  color: var(--btnt);
  border-bottom-right-radius: 4px;
}
.chat-msg.ai {
  align-self: flex-start;
  background: var(--bg2);
  color: var(--text);
  border-bottom-left-radius: 4px;
}
.chat-msg.error {
  align-self: flex-start;
  background: rgba(240,71,71,.12);
  color: var(--red);
  border-bottom-left-radius: 4px;
}
.typing-indicator {
  align-self: flex-start;
  background: var(--bg2);
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  padding: 11px 15px;
  display: flex;
  gap: 5px;
  align-items: center;
  animation: fadeIn .2s ease;
}
.typing-dot {
  width: 7px; height: 7px;
  background: var(--hint);
  border-radius: 50%;
  animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(1) { animation-delay: 0s;   }
.typing-dot:nth-child(2) { animation-delay: .2s;  }
.typing-dot:nth-child(3) { animation-delay: .4s;  }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0);    opacity: .4; }
  30%           { transform: translateY(-5px); opacity: 1;  }
}
.chat-input-bar {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  padding: 8px 10px;
  background: var(--bg2);
  border-top: 1px solid rgba(255,255,255,0.05);
}
#chatInput {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 8px 13px;
  font-size: 13px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 100px;
  overflow-y: auto;
  line-height: 1.45;
}
#chatInput::placeholder { color: var(--hint); }
.chat-send-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--btn);
  color: var(--btnt);
  border: none;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity .15s, transform .1s;
}
.chat-send-btn:active:not(:disabled) { transform: scale(0.92); }
.chat-send-btn:disabled { opacity: .4; cursor: default; }

/* ── Spinner ─────────────────────────────────────────── */
.spinner {
  width: 24px; height: 24px;
  border: 3px solid rgba(255,255,255,0.08);
  border-top-color: var(--btn);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error box ───────────────────────────────────────── */
.err-box {
  background: rgba(240,71,71,.12);
  border: 1px solid var(--red);
  border-radius: var(--r);
  padding: 10px;
  color: var(--red);
  font-size: 12px;
  text-align: center;
}

/* ── Bottom tabs ─────────────────────────────────────── */
.bottom-nav {
  display: flex;
  background: var(--bg2);
  border-top: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--hint);
  font-size: 10px;
  padding: 8px 0 10px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: color .15s;
}
.nav-icon { font-size: 20px; line-height: 1; }
.nav-btn.active { color: var(--btn); }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────── -->
<div class="header">
  <div class="header-title">📊 P2P Анализатор</div>
  <div class="pill-row" id="exRow">
    <button class="pill active" data-val="binance">🟡 Binance</button>
    <button class="pill"        data-val="bybit">🟠 Bybit</button>
  </div>
  <div class="pill-row" style="margin-top:6px;" id="fiatRow">
    <button class="pill active" data-val="KZT">🇰🇿 KZT</button>
    <button class="pill"        data-val="RUB">🇷🇺 RUB</button>
    <button class="pill"        data-val="TRY">🇹🇷 TRY</button>
    <button class="pill"        data-val="USD">🇺🇸 USD</button>
  </div>
  <div class="pill-row" style="margin-top:6px;" id="payRow"></div>
</div>

<!-- ── Spread bar ──────────────────────────────────── -->
<div class="spread-bar">
  <span class="price-big green" id="buyPrice">—</span>
  <span class="spread-chip"     id="spreadChip">Загрузка...</span>
  <span class="price-big red"   id="sellPrice">—</span>
</div>

<!-- ── Tab: Стакан ────────────────────────────────── -->
<div class="tab-panel" id="tab-book">
  <div class="refresh-ts" id="refreshTs"></div>
  <div class="book-grid">
    <div class="book-col buy-col">
      <div class="col-title">📗 Покупают</div>
      <div id="buyList"><div class="spinner"></div></div>
    </div>
    <div class="book-col sell-col">
      <div class="col-title">📕 Продают</div>
      <div id="sellList"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- ── Tab: График ────────────────────────────────── -->
<div class="tab-panel hidden" id="tab-chart">
  <div class="chart-card">
    <div class="chart-box">
      <canvas id="spreadChart"></canvas>
      <div id="chartEmpty" class="chart-empty" style="display:none;">
        ⏳ История ещё копится.<br>
        Данные собираются каждые 30 мин.<br>
        Зайди через несколько часов.
      </div>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-lbl">Средний спред</div>
      <div class="stat-val" id="avgSpread">—</div>
      <div class="stat-sub">за все время</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Текущий спред</div>
      <div class="stat-val" id="curSpread">—</div>
      <div class="stat-sub" id="curVsAvg"></div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Макс. спред</div>
      <div class="stat-val" id="maxSpread">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-lbl">Точек данных</div>
      <div class="stat-val" id="dataPoints">—</div>
      <div class="stat-sub">× 30 мин</div>
    </div>
  </div>
</div>

<!-- ── Tab: AI Chat ────────────────────────────────── -->
<div class="tab-panel hidden" id="tab-ai">
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input-bar">
    <textarea id="chatInput" placeholder="Спроси про цену, стратегию, риски..." rows="1"></textarea>
    <button class="chat-send-btn" id="chatSend" onclick="sendChat()">↑</button>
  </div>
</div>

<!-- ── Bottom nav ──────────────────────────────────── -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('book', this)">
    <span class="nav-icon">📊</span>Стакан
  </button>
  <button class="nav-btn" onclick="switchTab('chart', this)">
    <span class="nav-icon">📈</span>График
  </button>
  <button class="nav-btn" onclick="switchTab('ai', this)">
    <span class="nav-icon">🤖</span>AI
  </button>
</div>

<script>
/* ── Telegram WebApp init ──────────────────────────── */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ── State ─────────────────────────────────────────── */
const S = { exchange: 'binance', fiat: 'KZT', asset: 'USDT', tab: 'book', pay: '' };
let refreshTimer = null;
let chartInst    = null;
let chatHistory     = [];
let chatLoading     = false;
let chatInitialized = false;

/* ── Pay methods map ───────────────────────────────── */
const PAY_METHODS = {
  binance: {
    KZT: [{val:'', lbl:'Все банки'}, {val:'KaspiBank', lbl:'Kaspi'}, {val:'HalykBank', lbl:'Halyk'},
          {val:'Jusan', lbl:'Jusan'}, {val:'ForteBank', lbl:'Forte'}, {val:'FreedomBank', lbl:'Freedom'}],
    RUB: [{val:'', lbl:'Все банки'}, {val:'TinkoffNew', lbl:'Tinkoff'}, {val:'Sberbank', lbl:'Сбер'},
          {val:'RaiffeisenBank', lbl:'Raiffeisen'}, {val:'FPSBANK', lbl:'СБП'}],
    TRY: [{val:'', lbl:'Все банки'}, {val:'ZiraatBank', lbl:'Ziraat'}, {val:'Garanti', lbl:'Garanti'},
          {val:'Akbank', lbl:'Akbank'}, {val:'VakifBank', lbl:'Vakif'}, {val:'Papara', lbl:'Papara'}],
    USD: [{val:'', lbl:'Все банки'}, {val:'BankTransfer', lbl:'Bank Transfer'}],
  },
  bybit: {
    KZT: [{val:'', lbl:'Все банки'}, {val:'KaspiBank', lbl:'Kaspi'}, {val:'HalykBank', lbl:'Halyk'},
          {val:'FreedomBank', lbl:'Freedom'}, {val:'Jusan', lbl:'Jusan'}, {val:'ForteBank', lbl:'Forte'}],
    RUB: [{val:'', lbl:'Все банки'}, {val:'Tinkoff', lbl:'Tinkoff'}, {val:'Sberbank', lbl:'Сбер'},
          {val:'RaiffeisenBank', lbl:'Raiffeisen'}, {val:'SBP', lbl:'СБП'}],
    TRY: [{val:'', lbl:'Все банки'}, {val:'ZiraatBank', lbl:'Ziraat'}, {val:'Garanti', lbl:'Garanti'},
          {val:'Akbank', lbl:'Akbank'}, {val:'Papara', lbl:'Papara'}],
    USD: [{val:'', lbl:'Все банки'}, {val:'BankTransfer', lbl:'Bank Transfer'}],
  },
};

/* ── Pay row renderer ──────────────────────────────── */
function updatePayRow() {
  const row   = document.getElementById('payRow');
  const banks = (PAY_METHODS[S.exchange] || {})[S.fiat] || [{val:'', lbl:'Все банки'}];
  // Если текущий pay не входит в новый список — сбрасываем
  if (!banks.find(b => b.val === S.pay)) S.pay = '';
  row.innerHTML = banks.map(b =>
    `<button class="pill${S.pay === b.val ? ' active' : ''}" data-val="${esc(b.val)}">${esc(b.lbl)}</button>`
  ).join('');
  row.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      S.pay = btn.dataset.val;
      updatePayRow();
      clearInterval(refreshTimer);
      loadOrderbook();
      refreshTimer = setInterval(loadOrderbook, 10_000);
    });
  });
}

/* ── Selector wiring ───────────────────────────────── */
function wireGroup(groupId, stateKey) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`#${groupId} .pill`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      S[stateKey] = btn.dataset.val;
      onStateChange();
    });
  });
}
wireGroup('exRow',   'exchange');
wireGroup('fiatRow', 'fiat');

function onStateChange() {
  S.pay = '';          // сброс фильтра банка при смене биржи / фиата
  updatePayRow();
  clearInterval(refreshTimer);
  loadOrderbook();
  if (S.tab === 'chart') loadChart();
  resetChat();
  refreshTimer = setInterval(loadOrderbook, 10_000);
}

/* ── Tab switching ─────────────────────────────────── */
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById(`tab-${tab}`).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  S.tab = tab;
  if (tab === 'chart') loadChart();
  if (tab === 'book')  loadOrderbook();
  if (tab === 'ai')    initChat();
}

/* ── Formatting ────────────────────────────────────── */
const FMT_NUM = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmt(n)  { return FMT_NUM.format(n); }
function fmtK(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000)     return (n / 1_000).toFixed(1) + 'k';
  return n.toFixed(0);
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ── Orderbook ─────────────────────────────────────── */
async function loadOrderbook() {
  const { exchange, fiat, asset, pay } = S;
  const payQ = pay ? `?pay=${encodeURIComponent(pay)}` : '';
  try {
    const res  = await fetch(`/api/orderbook/${exchange}/${fiat}/${asset}${payQ}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderOrderbook(data);

    const now = new Date();
    document.getElementById('refreshTs').textContent =
      `Обновлено: ${now.toLocaleTimeString('ru-RU')}  · авто каждые 10 сек`;
  } catch (e) {
    const msg = `<div class="err-box">❌ ${esc(e.message)}</div>`;
    document.getElementById('buyList').innerHTML  = msg;
    document.getElementById('sellList').innerHTML = msg;
    document.getElementById('spreadChip').textContent = 'Ошибка';
  }
}

function renderOrderbook({ buy, sell, spread }) {
  // Spread bar
  if (buy.length)  document.getElementById('buyPrice').textContent  = fmt(buy[0].price);
  if (sell.length) document.getElementById('sellPrice').textContent = fmt(sell[0].price);

  const chip = document.getElementById('spreadChip');
  if (spread && spread.spread_pct != null) {
    const pct = spread.spread_pct;
    chip.textContent = `⇔ ${pct}%`;
    chip.className   = 'spread-chip' + (pct >= 0.5 ? ' good' : pct >= 0.2 ? ' mid' : '');
  } else {
    chip.textContent = '—';
    chip.className   = 'spread-chip';
  }

  document.getElementById('buyList').innerHTML  = adList(buy);
  document.getElementById('sellList').innerHTML = adList(sell);
}

function adList(ads) {
  if (!ads || !ads.length) return '<div class="ad-meta" style="text-align:center;padding:12px 0;">Нет данных</div>';
  return ads.map(ad => {
    const pay  = (ad.pay_types || []).slice(0, 2).map(p => `<span class="pay-pill">${esc(p)}</span>`).join('') || '—';
    const vol  = fmtK(ad.available  || 0);
    const min  = fmtK(ad.min_amount || 0);
    const max  = fmtK(ad.max_amount || 0);
    const comp = ad.completion || 0;
    const ord  = ad.orders || 0;
    return `
      <div class="ad-card">
        <div class="ad-price">${fmt(ad.price)}</div>
        <div class="ad-nick">${esc(ad.nickname || '—')}</div>
        <div class="ad-meta">
          ${vol} · ${min}–${max}<br>
          ${ord} сд · ${comp}%<br>
          ${pay}
          <span class="risk">${esc(ad.risk_badge || '')} ${esc(ad.risk_tooltip || '')}</span>
        </div>
      </div>`;
  }).join('');
}

/* ── Chart ─────────────────────────────────────────── */
async function loadChart() {
  const { exchange, fiat, asset } = S;
  const canvas = document.getElementById('spreadChart');
  const empty  = document.getElementById('chartEmpty');

  canvas.style.display = 'none';
  empty.style.display  = 'block';
  empty.textContent    = '⏳ Загружаю историю...';

  try {
    const res  = await fetch(`/api/history/${exchange}/${fiat}/${asset}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderChart(data.points || []);
  } catch (e) {
    empty.textContent = `❌ ${e.message}`;
  }
}

function renderChart(points) {
  const canvas = document.getElementById('spreadChart');
  const empty  = document.getElementById('chartEmpty');

  if (points.length < 2) {
    empty.style.display  = 'block';
    canvas.style.display = 'none';
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    return;
  }

  empty.style.display  = 'none';
  canvas.style.display = 'block';

  const labels = points.map(p => p.ts);
  const vals   = points.map(p => p.spread_pct);
  const avg    = vals.reduce((a, b) => a + b, 0) / vals.length;
  const maxV   = Math.max(...vals);
  const curV   = vals[vals.length - 1];

  // Stats
  document.getElementById('avgSpread').textContent  = avg.toFixed(3) + '%';
  document.getElementById('maxSpread').textContent  = maxV.toFixed(3) + '%';
  document.getElementById('dataPoints').textContent = points.length;

  const curEl = document.getElementById('curSpread');
  curEl.textContent = curV.toFixed(3) + '%';
  curEl.style.color = curV >= avg ? 'var(--green)' : 'var(--red)';

  const diff = curV - avg;
  document.getElementById('curVsAvg').textContent =
    (diff >= 0 ? '+' : '') + diff.toFixed(3) + '% vs avg';
  document.getElementById('curVsAvg').style.color = diff >= 0 ? 'var(--green)' : 'var(--red)';

  if (chartInst) chartInst.destroy();

  const ctx  = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 190);
  grad.addColorStop(0, 'rgba(44,165,224,.35)');
  grad.addColorStop(1, 'rgba(44,165,224,0)');

  chartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data:            vals,
        borderColor:     '#2ca5e0',
        backgroundColor: grad,
        borderWidth:     2,
        pointRadius:     points.length > 24 ? 0 : 3,
        pointBackgroundColor: '#2ca5e0',
        fill:            true,
        tension:         0.4,
      }, {
        // Average line
        data:        Array(vals.length).fill(avg),
        borderColor: 'rgba(250,166,26,.5)',
        borderWidth: 1,
        borderDash:  [5, 4],
        pointRadius: 0,
        fill:        false,
        tension:     0,
      }]
    },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      animation:           false,
      interaction:         { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.datasetIndex === 0
              ? `Спред: ${ctx.parsed.y.toFixed(4)}%`
              : `Avg: ${ctx.parsed.y.toFixed(4)}%`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#708499', maxTicksLimit: 6, maxRotation: 0, font: { size: 9 } },
          grid:  { color: 'rgba(255,255,255,0.04)' }
        },
        y: {
          ticks: {
            color: '#708499',
            font:  { size: 9 },
            callback: v => v.toFixed(2) + '%'
          },
          grid: { color: 'rgba(255,255,255,0.04)' }
        }
      }
    }
  });
}

/* ── AI Chat ───────────────────────────────────────── */
function appendBubble(role, text) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className   = `chat-msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function showTyping() {
  const box = document.getElementById('chatMessages');
  const el  = document.createElement('div');
  el.className = 'typing-indicator';
  el.id        = 'typingEl';
  el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingEl');
  if (el) el.remove();
}

async function sendChat(autoMsg) {
  if (chatLoading) return;

  const input   = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSend');
  const text    = autoMsg || input.value.trim();
  if (!text) return;

  if (!autoMsg) {
    input.value        = '';
    input.style.height = '';
    appendBubble('user', text);
  }

  chatLoading      = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res  = await fetch('/api/chat', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        exchange: S.exchange,
        fiat:     S.fiat,
        asset:    S.asset,
        history:  chatHistory,
        message:  text,
      }),
    });
    const data = await res.json();
    hideTyping();

    if (data.error) {
      appendBubble('error', '❌ ' + data.error);
    } else {
      chatHistory = data.history || [];
      appendBubble('ai', data.response);
    }
  } catch (e) {
    hideTyping();
    appendBubble('error', '❌ Ошибка связи: ' + e.message);
  } finally {
    chatLoading      = false;
    sendBtn.disabled = false;
  }
}

function initChat() {
  if (chatInitialized) return;
  chatInitialized = true;
  // Авто-приветствие: AI сам загружает рынок и даёт краткий обзор
  sendChat('Привет! Загрузи текущий стакан и скажи: какая оптимальная цена для выставления и стоит ли сейчас торговать?');
}

function resetChat() {
  chatHistory     = [];
  chatInitialized = false;
  const box       = document.getElementById('chatMessages');
  if (box) box.innerHTML = '';
  if (S.tab === 'ai') initChat();
}

// Авто-растягивание textarea
document.getElementById('chatInput').addEventListener('input', function () {
  this.style.height = '';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

// Enter = отправить, Shift+Enter = перенос строки
document.getElementById('chatInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

/* ── Boot ──────────────────────────────────────────── */
updatePayRow();
loadOrderbook();
refreshTimer = setInterval(loadOrderbook, 10_000);
</script>
